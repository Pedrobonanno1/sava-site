<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- A imagem de compartilhamento da landing (og:image, 1200x630). A manchete é a do topo da landing; o aparelho é o
     iPhone do topo no fim da cena (og/fone.png, gerado por og/fone.mjs). Renderizar com og/renderizar.mjs. -->
<style>
/* Paleta do app — VERBATIM (skill sava-landing-page, B0). Não editar. */
:root {
  --cream: #F7F5EF; --cream-deep: #ECE8DC; --fill: #EFEDE4;
  --ink: #23261F; --ink-soft: #787C6C;
  --sage: #75886A; --sage-deep: #333D2B; --sage-tint: #E4E9DA;
  --steel: #6E8291; --steel-deep: #3C4C58; --steel-tint: #E2E9EE;
  --dune: #8A7B63; --dune-tint: #EDE7DB;
  --rose: #A97583; --rose-deep: #6E4653; --rose-tint: #F0E2E6;
  --amber: #B98A44; --amber-deep: #7A5A2A; --amber-tint: #F6EBD7; --amber-light: #E3C692;
  --white: #FFFFFF;
  --serif: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
:root { --chip-border: #E5E2D5; color-scheme: light; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--cream); }
body { position: relative; font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
/* O halo atrás do aparelho (objeto vivo): o .halo do kit, sálvia com um fio de âmbar. */
.halo { position: absolute; width: 760px; height: 760px; right: -150px; top: -40px; border-radius: 50%;
  background: radial-gradient(circle at 50% 45%, rgba(185,138,68,.14), rgba(117,136,106,.16) 45%, transparent 70%); }
.fone { position: absolute; right: 70px; top: 26px; height: 790px; }
.texto { position: absolute; left: 80px; top: 60px; width: 600px; height: 510px; display: flex; flex-direction: column; }
.marca { font-family: var(--serif); font-weight: 500; font-size: 28px; letter-spacing: .05em; }
.olho { margin-top: auto; font-size: 14px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--sage-deep); }
h1 { margin-top: 16px; font-family: var(--serif); font-weight: 500; font-size: 60px; line-height: 1.06; letter-spacing: -.015em; text-wrap: balance; }
h1 span { color: var(--sage); }
.selos { display: flex; gap: 10px; margin-top: 28px; }
.selo { flex: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; padding: 9px 15px; border-radius: 999px; background: var(--white);
  border: 1px solid var(--chip-border); font-size: 15px; color: rgba(35,38,31,.78); }
.selo i { width: 7px; height: 7px; border-radius: 50%; background: var(--sage); }
.selo b { color: var(--ink); font-weight: 700; }
.selo b.num { font-weight: 800; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="halo"></div>
  <img class="fone" src="fone.png" alt="">
  <div class="texto">
    <span class="marca">SAVA</span>
    <p class="olho">Contabilidade do médico PJ</p>
    <h1>A burocracia da sua empresa médica, <span>resolvida pelo celular.</span></h1>
    <div class="selos">
      <span class="selo"><i></i><b class="num">R$ 300/mês</b> com tudo dentro</span>
      <span class="selo"><i></i><b>Gente conferindo</b> antes de você pagar</span>
    </div>
  </div>
</body>
</html>
